[level]
name = "levels.camera-showcase"
kind = "world"

[world]
source = "world.yaml"

# Separate masked bands, packed into the same material atlases as the wall.
[[textures]]
name = "wall-top"
source = "wall-top.png"
profile = "environment"

# Masked brick trim uses the same surface recipe as the main wall.
[textures.materialize]
preset = "brick"
metallic_scale = 0

[textures.material_strengths]
normal = 1.0
height = 1.4
ao = 0.8
rim = 0.0

[[textures]]
name = "wall-bottom"
source = "wall-bottom.png"
profile = "environment"

# Masked brick trim uses the same surface recipe as the main wall.
[textures.materialize]
preset = "brick"
metallic_scale = 0

[textures.material_strengths]
normal = 1.0
height = 1.4
ao = 0.8
rim = 0.0

[[textures]]
name = "floor"
source = "floor.png"
profile = "environment"

# Jointed concrete gallery floor tiles.
[textures.materialize]
preset = "concrete"
metallic_scale = 0

[textures.material_strengths]
normal = 0.9
height = 0.8
ao = 0.9
rim = 0.6

[[textures]]
name = "ceiling"
source = "ceiling.png"
profile = "environment"

# Painted plaster gallery ceiling panels.
[textures.materialize]
