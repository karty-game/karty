# $schema: ../../.karty/schemas/levels/showcase.schema.json
version: 8

rooms:
  - id: hall
    wall_secondary: { texture: z-detail-grain, strength: 0.22, uv: { scale: { x: 5, y: 5 } } }
    wall_uv: { mode: wrap }
    wall_bands:
      top: { texture: wall-top, height: 0.5, repeat_width: 2 }
      bottom: { texture: wall-bottom, height: 0.5, repeat_width: 2 }
    boundary:
      - { id: south, start: { x: 0, y: 0 }, end: { x: 4, y: 0 }, material: wall }
      - { id: doorway, start: { x: 4, y: 0 }, end: { x: 4, y: 2 }, material: wall }
      - { id: inset-south, start: { x: 4, y: 2 }, end: { x: 2, y: 2 }, material: wall }
      - { id: inset-east, start: { x: 2, y: 2 }, end: { x: 2, y: 6 }, material: wall }
      - { id: north, start: { x: 2, y: 6 }, end: { x: 0, y: 6 }, material: wall }
      - { id: west, start: { x: 0, y: 6 }, end: { x: 0, y: 4 }, material: wall }
      - { id: courtyard, start: { x: 0, y: 4 }, end: { x: 0, y: 0 }, material: wall }
    floor: { a: 0.08, b: 0, c: 0 }
    ceiling: { a: 0, b: 0, c: 4.6 }
    floor_material: floor
    ceiling_material: ceiling
    contents:
      - { id: player-spawn, kind: spawn, position: { x: 1, y: 1, z: 1.7 } }
      - id: player-marker
        kind: actor
        position: { x: 1.34, y: 1, z: 1.733 }
        actor:
          tags: [player-marker]
          sprite:
            { texture: decal, facing: camera-facing, alpha: cutout, width: 1, height: 1, origin_x: 0.5, origin_y: 0.5 }
      - id: camera-facing-adventurer
        kind: actor
        position: { x: 3.2, y: 0.55, z: 0.27 }
        actor:
          tags: [billboard, interactive]
          sprite:
            { texture: character, facing: upright, alpha: cutout, width: 1.4, height: 2, origin_x: 0.5, origin_y: 1 }
      - id: upright-adventurer
        kind: actor
        position: { x: 1, y: 3.5, z: 0.09 }
        actor:
          yaw_degrees: 25
          tags: [interactive, upright]
          sprite:
            { texture: character, facing: upright, alpha: cutout, width: 1.05, height: 1.8, origin_x: 0.5, origin_y: 1 }
      - id: blended-ghost
        kind: actor
        position: { x: 3.1, y: 1.45, z: 0.26 }
        actor:
          scale: { x: 0.8, y: 0.8, z: 0.8 }
          tags: [blend, interactive]
          sprite: { texture: ghost, facing: upright, alpha: blend, width: 1.2, height: 1.7, origin_x: 0.5, origin_y: 1 }
      - id: fixed-sign
        kind: actor
        position: { x: 1, y: 5.88, z: 1.6 }
        actor:
          tags: [fixed, interactive]
          sprite: { texture: sign, facing: fixed, alpha: cutout, width: 1.5, height: 1, origin_x: 0.5, origin_y: 0.5 }
      - id: slope-decal
        kind: actor
        position: { x: 2.5, y: 1.2, z: 0.205 }
        actor:
          yaw_degrees: -90
          pitch_degrees: 85.4260787400991
          tags: [decal, interactive]
          sprite: { texture: decal, facing: fixed, alpha: blend, width: 1.2, height: 1.2, origin_x: 0.5, origin_y: 0.5 }

      - id: south-torch-flame
        kind: actor
        position: { x: 1, y: 0.32, z: 2.68 }
        actor:
          tags: [wall-torch]
          animation: { preset: brazier-fire }
          sprite:
            {
              texture: z-hanging-fire-1,
              facing: upright,
              alpha: blend,
              width: 0.45,
              height: 0.65,
              origin_x: 0.5,
              origin_y: 1,
            }
      - id: west-torch-flame
        kind: actor
        position: { x: 0.32, y: 4.5, z: 2.68 }
        actor:
          tags: [wall-torch]
          animation: { preset: brazier-fire }
          sprite:
            {
              texture: z-hanging-fire-1,
              facing: upright,
              alpha: blend,
              width: 0.45,
              height: 0.65,
              origin_x: 0.5,
              origin_y: 1,
            }

prefabs:
  - id: gallery
    instances:
      - id: wall-torch
        prefab: wall-sconce
        transform: { translation: { x: 2, y: 0, z: 0 }, yaw_degrees: 0 }
    rooms:
      - id: room
        wall_secondary: { texture: z-detail-grain, strength: 0.22, uv: { scale: { x: 5, y: 5 } } }
        wall_uv: { mode: wrap }
        wall_bands:
          top: { texture: wall-top, height: 0.5, repeat_width: 2 }
          bottom: { texture: wall-bottom, height: 0.5, repeat_width: 2 }
        boundary:
          - { id: south, start: { x: 0, y: 0 }, end: { x: 4, y: 0 }, material: wall }
          - { id: exit, start: { x: 4, y: 0 }, end: { x: 4, y: 2 }, material: wall }
          - { id: north, start: { x: 4, y: 2 }, end: { x: 0, y: 2 }, material: wall }
          - { id: entrance, start: { x: 0, y: 2 }, end: { x: 0, y: 0 }, material: wall }
        floor: { a: 0, b: 0, c: 0.32 }
        ceiling: { a: 0, b: 0, c: 4.6 }
        floor_material: floor
        ceiling_material: ceiling
        contents:
          - id: marker
            kind: actor
            position: { x: 2, y: 0.65, z: 0.33 }
            actor:
              yaw_degrees: 45
              tags: [cross, gallery]
              sprite:
                { texture: tree, facing: cross, alpha: cutout, width: 0.9, height: 2.1, origin_x: 0.5, origin_y: 1 }
          - id: torch-flame
            kind: actor
            position: { x: 2, y: 0.32, z: 2.68 }
            actor:
              tags: [wall-torch]
              animation: { preset: brazier-fire }
              sprite:
                {
                  texture: z-hanging-fire-1,
                  facing: upright,
                  alpha: blend,
                  width: 0.45,
                  height: 0.65,
                  origin_x: 0.5,
                  origin_y: 1,
                }
    ports:
      - { id: entrance, endpoint: { room: room, edge: entrance } }
      - { id: exit, endpoint: { room: room, edge: exit } }

  - id: corner
    instances:
      - id: wall-torch
        prefab: wall-sconce
        transform: { translation: { x: 1, y: 0, z: 0 }, yaw_degrees: 0 }
    rooms:
      - id: room
        wall_secondary: { texture: z-detail-grain, strength: 0.22, uv: { scale: { x: 5, y: 5 } } }
        wall_uv: { mode: wrap }
        wall_bands:
          top: { texture: wall-top, height: 0.5, repeat_width: 2 }
          bottom: { texture: wall-bottom, height: 0.5, repeat_width: 2 }
        boundary:
          - { id: south, start: { x: 0, y: 0 }, end: { x: 2, y: 0 }, material: wall }
          - { id: east, start: { x: 2, y: 0 }, end: { x: 2, y: 2 }, material: wall }
          - { id: exit, start: { x: 2, y: 2 }, end: { x: 0, y: 2 }, material: wall }
          - { id: entrance, start: { x: 0, y: 2 }, end: { x: 0, y: 0 }, material: wall }
        floor: { a: 0.12, b: 0, c: 0.32 }
        ceiling: { a: 0, b: 0, c: 4.6 }
        floor_material: floor
        ceiling_material: ceiling
        contents:
          - id: corner-sign
            kind: actor
            position: { x: 1.88, y: 1, z: 2.3 }
            actor:
              yaw_degrees: -90
              tags: [corner, fixed]
              sprite:
                { texture: sign, facing: fixed, alpha: cutout, width: 1.4, height: 0.95, origin_x: 0.5, origin_y: 0.5 }
          - id: torch-flame
            kind: actor
            position: { x: 1, y: 0.32, z: 2.68 }
            actor:
              tags: [wall-torch]
              animation: { preset: brazier-fire }
              sprite:
                {
                  texture: z-hanging-fire-1,
                  facing: upright,
                  alpha: blend,
                  width: 0.45,
                  height: 0.65,
                  origin_x: 0.5,
                  origin_y: 1,
                }
    ports:
      - { id: entrance, endpoint: { room: room, edge: entrance } }
      - { id: exit, endpoint: { room: room, edge: exit } }

  - id: ascent
    instances:
      - id: wall-torch
        prefab: wall-sconce
        transform: { translation: { x: 0, y: 2, z: -0.2 }, yaw_degrees: -90 }
    rooms:
      - id: room
        wall_secondary: { texture: z-detail-grain, strength: 0.22, uv: { scale: { x: 5, y: 5 } } }
        wall_uv: { mode: wrap }
        wall_bands:
          top: { texture: wall-top, height: 0.5, repeat_width: 2 }
          bottom: { texture: wall-bottom, height: 0.5, repeat_width: 2 }
        boundary:
          - { id: entrance, start: { x: 0, y: 0 }, end: { x: 2, y: 0 }, material: wall }
          - { id: east, start: { x: 2, y: 0 }, end: { x: 2, y: 4 }, material: wall }
          - { id: exit, start: { x: 2, y: 4 }, end: { x: 0, y: 4 }, material: wall }
          - { id: west, start: { x: 0, y: 4 }, end: { x: 0, y: 0 }, material: wall }
        floor: { a: 0.12, b: 0.16, c: 0.32 }
        ceiling: { a: 0, b: 0, c: 3.2 }
        floor_material: floor
        ceiling_material: ceiling
        contents:
          - id: beacon
            kind: actor
            position: { x: 1, y: 2.8, z: 1.4 }
            actor:
              tags: [beacon, corridor]
              sprite:
                { texture: ghost, facing: upright, alpha: blend, width: 1.1, height: 1.7, origin_x: 0.5, origin_y: 1 }
          - id: torch-flame
            kind: actor
            position: { x: 0.32, y: 2, z: 2.48 }
            actor:
              tags: [wall-torch]
              animation: { preset: brazier-fire }
              sprite:
                {
                  texture: z-hanging-fire-1,
                  facing: upright,
                  alpha: blend,
                  width: 0.45,
                  height: 0.65,
                  origin_x: 0.5,
                  origin_y: 1,
                }
    ports:
      - { id: entrance, endpoint: { room: room, edge: entrance } }
      - { id: exit, endpoint: { room: room, edge: exit } }

