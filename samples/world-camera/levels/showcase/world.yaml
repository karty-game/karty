instances:
  - id: hall-sconce-south
    prefab: wall-sconce
    transform: { translation: { x: 1, y: 0, z: 0 } }
  - id: hall-sconce-west
    prefab: wall-sconce
    transform: { translation: { x: 0, y: 4.5, z: 0 }, yaw_degrees: -90 }
  - id: roman-court
    prefab: roman-peristyle
    transform: { scale: 1 }
  - id: gallery-a
    prefab: gallery
    transform: { translation: { x: 4, y: 0, z: 0 }, scale: 1 }
    tags: [gallery, gallery-a, spinner]
  - id: gallery-b
    prefab: gallery
    transform: { translation: { x: 8, y: 0, z: 0 }, scale: 1 }
    tags: [gallery, gallery-b]
  - id: gallery-c
    prefab: gallery
    transform: { translation: { x: 12, y: 0, z: 0 }, scale: 1 }
    tags: [gallery, gallery-c]
  - id: east-corner
    prefab: corner
    transform: { translation: { x: 16, y: 0, z: 0 }, scale: 1 }
  - id: north-ascent
    prefab: ascent
    transform: { translation: { x: 16, y: 2, z: 0 }, scale: 1 }

connections:
  - id: hall-to-courtyard
    a: { room: hall, edge: courtyard }
    b: { instance: roman-court, port: entrance }
  - id: hall-to-gallery-a
    a: { room: hall, edge: doorway }
    b: { instance: gallery-a, port: entrance }
  - id: gallery-a-to-gallery-b
    a: { instance: gallery-a, port: exit }
    b: { instance: gallery-b, port: entrance }
  - id: gallery-b-to-gallery-c
    a: { instance: gallery-b, port: exit }
    b: { instance: gallery-c, port: entrance }
  - id: gallery-c-to-corner
    a: { instance: gallery-c, port: exit }
    b: { instance: east-corner, port: entrance }
  - id: corner-to-ascent
    a: { instance: east-corner, port: exit }
    b: { instance: north-ascent, port: entrance }
  - id: ascent-to-hall
    a: { instance: north-ascent, port: exit }
    b: { room: hall, edge: north }
    non_euclidean: true

