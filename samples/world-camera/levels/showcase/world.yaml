version: 2

rooms:
  - id: hall
    boundary:
      - {id: south, start: {x: 0, y: 0}, end: {x: 4, y: 0}, material: wall}
      - {id: doorway, start: {x: 4, y: 0}, end: {x: 4, y: 2}, material: wall}
      - {id: inset-south, start: {x: 4, y: 2}, end: {x: 2, y: 2}, material: wall}
      - {id: inset-east, start: {x: 2, y: 2}, end: {x: 2, y: 6}, material: wall}
      - {id: north, start: {x: 2, y: 6}, end: {x: 0, y: 6}, material: wall}
      - {id: west, start: {x: 0, y: 6}, end: {x: 0, y: 0}, material: wall}
    floor: {a: 0.03, b: 0.04, c: 0}
    ceiling: {a: 0.01, b: -0.02, c: 4}
    floor_material: floor
    ceiling_material: ceiling
    contents:
      - {id: player-spawn, kind: spawn, position: {x: 1, y: 1, z: 1.5}}
      - id: camera-facing
        kind: actor
        position: {x: 3, y: 1.2, z: 0.15}
        actor:
          tags: [billboard, interactive]
          sprite: {texture: actor, facing: camera-facing, alpha: cutout, width: 1.3, height: 2, origin_x: 0.5, origin_y: 1}
      - id: upright
        kind: actor
        position: {x: 1, y: 3.5, z: 0.18}
        actor:
          yaw_degrees: 25
          tags: [interactive, upright]
          sprite: {texture: actor, facing: upright, alpha: cutout, width: 1.3, height: 2, origin_x: 0.5, origin_y: 1}
      - id: blended
        kind: actor
        position: {x: 2.2, y: 1.55, z: 0.14}
        actor:
          scale: {x: 0.8, y: 0.8, z: 0.8}
          tags: [blend, interactive]
          sprite: {texture: actor, facing: camera-facing, alpha: blend, width: 1.3, height: 2, origin_x: 0.5, origin_y: 1}
      - id: fixed-sign
        kind: actor
        position: {x: 1, y: 5.88, z: 1.6}
        actor:
          tags: [fixed, interactive]
          sprite: {texture: actor, facing: fixed, alpha: cutout, width: 1.5, height: 1.5, origin_x: 0.5, origin_y: 0.5}
      - id: slope-decal
        kind: actor
        position: {x: 2.5, y: 1.2, z: 0.13}
        actor:
          yaw_degrees: -36.8698976
          pitch_degrees: 87.1375948
          tags: [decal, interactive]
          sprite: {texture: actor, facing: fixed, alpha: blend, width: 1.2, height: 1.2, origin_x: 0.5, origin_y: 0.5}

prefabs:
  - id: gallery
    rooms:
      - id: room
        boundary:
          - {id: south, start: {x: 0, y: 0}, end: {x: 4, y: 0}, material: wall}
          - {id: exit, start: {x: 4, y: 0}, end: {x: 4, y: 2}, material: wall}
          - {id: north, start: {x: 4, y: 2}, end: {x: 0, y: 2}, material: wall}
          - {id: entrance, start: {x: 0, y: 2}, end: {x: 0, y: 0}, material: wall}
        floor: {a: 0.03, b: 0.04, c: 0}
        ceiling: {a: 0.01, b: -0.02, c: 4}
        floor_material: floor
        ceiling_material: ceiling
        contents:
          - id: marker
            kind: actor
            position: {x: 2, y: 1, z: 0.12}
            actor:
              yaw_degrees: 45
              tags: [cross, gallery]
              sprite: {texture: actor, facing: cross, alpha: cutout, width: 1.4, height: 2.2, origin_x: 0.5, origin_y: 1}
    ports:
      - {id: entrance, endpoint: {room: room, edge: entrance}}
      - {id: exit, endpoint: {room: room, edge: exit}}

instances:
  - id: gallery-a
    prefab: gallery
    transform: {translation: {x: 4, y: 0, z: 0}, scale: 1}
    tags: [gallery, gallery-a]
  - id: gallery-b
    prefab: gallery
    transform: {translation: {x: 8, y: 0, z: 0}, scale: 1}
    tags: [gallery, gallery-b]

connections:
  - id: hall-to-gallery-a
    a: {room: hall, edge: doorway}
    b: {instance: gallery-a, port: entrance}
  - id: gallery-a-to-gallery-b
    a: {instance: gallery-a, port: exit}
    b: {instance: gallery-b, port: entrance}
