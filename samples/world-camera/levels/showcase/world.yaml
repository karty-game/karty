    transform: {translation: {x: 4, y: 0, z: 0}, scale: 1}
    tags: [gallery, gallery-a, spinner]
  - id: gallery-b
    prefab: gallery
    transform: {translation: {x: 8, y: 0, z: 0}, scale: 1}
    tags: [gallery, gallery-b]
  - id: gallery-c
    prefab: gallery
    transform: {translation: {x: 12, y: 0, z: 0}, scale: 1}
    tags: [gallery, gallery-c]
  - id: east-corner
    prefab: corner
    transform: {translation: {x: 16, y: 0, z: 0}, scale: 1}
  - id: north-ascent
    prefab: ascent
    transform: {translation: {x: 16, y: 2, z: 0}, scale: 1}

connections:
  - id: hall-to-courtyard
    a: {room: hall, edge: courtyard}
    b: {instance: roman-court, port: entrance}
  - id: hall-to-gallery-a
    a: {room: hall, edge: doorway}
    b: {instance: gallery-a, port: entrance}
  - id: gallery-a-to-gallery-b
    a: {instance: gallery-a, port: exit}
    b: {instance: gallery-b, port: entrance}
  - id: gallery-b-to-gallery-c
