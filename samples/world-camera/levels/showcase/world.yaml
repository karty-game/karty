# The visible top ripples above a real mosaic bottom; hidden slab edges stay fixed.
animations:
  version: 1
  presets:
    - { name: brazier-fire, kind: flipbook, frames: [z-hanging-fire-1, z-hanging-fire-2, z-hanging-fire-3], fps: 10 }
    - {
        name: court-ripple,
        kind: liquid,
        amplitude: 0.045,
        frequency: 1.6,
        speed: 0.55,
        surface_amplitude: 0.035,
        opacity: 0.72,
      }
    - { name: hidden-water-boundary, kind: liquid, frequency: 1, opacity: 0 }
  materials:
    - { material: z-court-water, preset: court-ripple }
    - { material: z-water-boundary, preset: hidden-water-boundary }
