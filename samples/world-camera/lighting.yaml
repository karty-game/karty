# Candidate SDK 0.0.8 preset used by the normal sample and derived previews.
# Positions are global; court spans x=-16..0, y=-4..12.
lighting:
  version: 1
  actors: true
  ambient: {x: 0.08, y: 0.08, z: 0.09}
  ambient_cube:
    positive_x: {x: 0.11, y: 0.12, z: 0.14}
    negative_x: {x: 0.07, y: 0.08, z: 0.095}
    positive_y: {x: 0.12, y: 0.135, z: 0.15}
    negative_y: {x: 0.075, y: 0.085, z: 0.10}
    positive_z: {x: 0.30, y: 0.36, z: 0.44}
    negative_z: {x: 0.04, y: 0.045, z: 0.04}
  lights:
    - {id: court-daylight, position: {x: -10.5, y: 2, z: 7}, color: {x: 0.88, y: 0.91, z: 0.96}, radius: 12}
    - {id: west-brazier, position: {x: -14, y: 4, z: 2.4}, color: {x: 1, y: 0.42, z: 0.18}, radius: 6}
    - {id: east-brazier, position: {x: -2, y: 4, z: 2.4}, color: {x: 1, y: 0.62, z: 0.30}, radius: 6}
    - {id: north-cool-fill, position: {x: -8, y: 10, z: 2.8}, color: {x: 0.22, y: 0.58, z: 0.88}, radius: 6}
    - {id: hall-fill, position: {x: 2, y: 1, z: 3}, color: {x: 0.92, y: 0.83, z: 0.68}, radius: 7}
    - {id: gallery-fill, position: {x: 10, y: 1, z: 3}, color: {x: 0.74, y: 0.87, z: 1}, radius: 9}
    # Unbaked moving light: passes the corridor trees and the hall actors.
    - id: corridor-wanderer
      position: {x: 3, y: 1, z: 2.2}
      color: {x: 1, y: 0.28, z: 0.06}
      radius: 4
      motion:
        version: 1
        offset: {x: 12, y: 0, z: 0.8}
        period_seconds: 12
