[level]
name = "levels.crate-room"
kind = "world"

[world]
source = "world.yaml"

[lightmap]
enabled = true
offline = true
density = 16
page_size = 1024
padding = 4
bake_samples = 32
bake_bounces = 3
bake_denoise = "medium"

[[textures]]
name = "floor"
source = "floor.png"
profile = "environment"

# Jointed concrete floor panels.
[textures.materialize]
preset = "concrete"
metallic_scale = 0

[textures.material_strengths]
normal = 0
height = 0
ao = 0
rim = 0

