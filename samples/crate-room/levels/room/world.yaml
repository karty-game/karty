version: 11
uv: { mode: wrap }
lighting:
  version: 1
  actors: true
  ambient: { x: 0.22, y: 0.25, z: 0.3 }
  lights:
    - { id: warm-left, position: { x: -6, y: -3, z: 6 }, color: { x: 1, y: 0.77, z: 0.48 }, radius: 24 }
    - { id: cool-right, position: { x: 7, y: 8, z: 6 }, color: { x: 0.4, y: 0.65, z: 1 }, radius: 24 }
rooms:
  - id: crate-room
    floor: { c: 0 }
    ceiling: { c: 9 }
    floor_material: fps-kit.floor-gray-grid
    ceiling_material: fps-kit.ceiling-dark-panel
    boundary:
      - { id: south, start: { x: -11, y: -14 }, end: { x: 11, y: -14 }, material: fps-kit.wall-blue-concrete }
      - { id: east, start: { x: 11, y: -14 }, end: { x: 11, y: 14 }, material: fps-kit.wall-blue-concrete }
      - { id: north, start: { x: 11, y: 14 }, end: { x: -11, y: 14 }, material: fps-kit.wall-blue-concrete }
      - { id: west, start: { x: -11, y: 14 }, end: { x: -11, y: -14 }, material: fps-kit.wall-blue-concrete }
# Runtime geometry comes from FPS Kit; physics bodies remain game-owned.
prefabs:
  - id: crate
    renderable: true
    instances:
      - id: shape
        prefab: fps-kit.crate-medium-dynamic

# Banks and bumpers use the same collision-enabled geometry as rendering.
solids:
  - id: west-bank
    footprint: [{ x: -10.8, y: -9 }, { x: -8, y: -9 }, { x: -8, y: 13.5 }, { x: -10.8, y: 13.5 }]
    bottom: { c: -0.05 }
    top: { a: -0.7, c: -5.45 }
    side_material: fps-kit.trim-hazard
    top_material: fps-kit.trim-hazard
    bottom_material: fps-kit.trim-hazard
    collision: true
  - id: east-bank
    footprint: [{ x: 8, y: -9 }, { x: 10.8, y: -9 }, { x: 10.8, y: 13.5 }, { x: 8, y: 13.5 }]
    bottom: { c: -0.05 }
    top: { a: 0.7, c: -5.45 }
    side_material: fps-kit.trim-hazard
    top_material: fps-kit.trim-hazard
    bottom_material: fps-kit.trim-hazard
    collision: true
  - id: back-bank
    footprint: [{ x: -8, y: 11.5 }, { x: 8, y: 11.5 }, { x: 8, y: 13.5 }, { x: -8, y: 13.5 }]
    bottom: { c: -0.05 }
    top: { b: 0.85, c: -9.625 }
    side_material: fps-kit.trim-hazard
    top_material: fps-kit.trim-hazard
    bottom_material: fps-kit.trim-hazard
    collision: true

# Shared red metal bumpers: low obstacle, crouch cover and full-height cover.
instances:
  - id: bumper-1
    prefab: fps-kit.bumper-low
    transform: { translation: { x: -4.5, y: -5, z: 0 } }
  - id: bumper-2
    prefab: fps-kit.bumper-cover
    transform: { translation: { x: 4.5, y: -5, z: 0 } }
  - id: bumper-3
    prefab: fps-kit.bumper-tall
    transform: { translation: { x: 0, y: 7.75, z: 0 } }
