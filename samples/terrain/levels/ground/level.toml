[level]
name = "levels.ground"
kind = "world"

[world]
source = "world.yaml"

[terrain]
source = "terrain.bin"

# Shared ocean surface: world animation supplies ripples and the fluid volume
# supplies underwater medium effects. The authored geometric sea level is Z 0.
[[textures]]
name = "ocean"
source = "ocean-v2.png"
profile = "environment"

[textures.transform]
max_width = 512
max_height = 512

[textures.materialize]
preset = "water"
metallic_scale = 0

[textures.material_strengths]
normal = 0.4
height = 0
ao = 0
rim = 0.1

[[textures]]
name = "ocean-boundary"
source = "ocean.png"
profile = "environment"

# Opaque sand below every heightfield vertex continues beneath the distant sea.
[[textures]]
name = "seabed"
source = "seabed.png"
profile = "environment"

# Distant submerged backdrop; retain the original while limiting runtime texels.
[textures.transform]
max_width = 512
max_height = 512

[[textures]]
name = "pier-wood"
source = "pier-wood-v1.png"
profile = "environment"

[textures.transform]
max_width = 512
max_height = 512

[textures.materialize]
preset = "wood"
metallic_scale = 0

[textures.material_strengths]
normal = 0.3
height = 0.015
ao = 0.3
rim = 0

