# Handwritten smoke and reactor recipes. The reviewed fire is composed from the flat Brackeys templates and fire-refinement.yaml.
# Reusable static-mask industrial effects. No animated sprite frames or smoke actors.
# Source v11 / particle v2 supports additive fire and GPU source-over alpha smoke.
# Brackeys CC0 method is a technical baseline; the inaccessible user reference has not been matched.
# Each prefab stays within ten emitter layers. Origin is each effect's foot.
# Reference study precedes authoring; see ../README.md for sources and limitations.
# Copy selected presets, prefabs and static texture declarations into a v11 world.
# Effects reserve finite schedules; capacities are per emitter, not active counts.
