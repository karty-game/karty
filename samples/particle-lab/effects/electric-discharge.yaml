# Authored sprite-segment discharge; static primitives are not a complete bolt drawing.
# Primary references: Epic Niagara Beam Effect (short lifetime / jitter / segmented beam)
# https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-beam-effect-in-niagara-for-unreal-engine
# and burst/fallout composition:
# https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-sparks-effect-in-niagara-for-unreal-engine
# Karty has no ribbons, connected endpoints or live jitter field. Independently seeded
# birth positions, angles and staggered short-lived segments approximate crackling forks.
# This is an authored adaptation, not Niagara import or renderer-parity evidence.
# Seven layers / six presets: two branch passes share their static primitive/preset.
version: 11
particles:
  version: 2
  presets:
    - name: industrial-electric-charge
      capacity: 14
      emission: { rate: 16, duration_seconds: 0.78 }
      lifetime_seconds: { min: 0.12, max: 0.24 }
