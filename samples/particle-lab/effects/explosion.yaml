# Authored static-layer adaptation of Brackeys' FireExplosion (not its flipbook variant).
# Source: https://github.com/Brackeys/vfx-in-godot/blob/23b58f272b828b0a894ed7ef72fbf9033ee9d177/vfx/scenes/fire_explosion.tscn
# Source roles/counts: Fire64, Smoke32, Fireballs6, Debris10, Sparks50. Shock SphereMesh omitted.
# This is an authored adaptation, not a declarative conversion or visual-parity claim.
# Sphere/cone/radial correlations become bounded boxes; mesh debris becomes static flecks.
# Collision, turbulence, HDR emission and per-particle random scale are unavailable.
# Shorter ballistic lives avoid pretending to collide with the floor; alpha limits prevent
# 64 overlapping SDR fire sprites from remaining saturated white. No extra hot-core sprite.
version: 11
particles:
  version: 2
  presets:
    - name: industrial-explosion-flame-impulse
      capacity: 64
      emission:
        bursts: [{ at_seconds: 0, count: 64 }]
      lifetime_seconds: { min: 0.98, max: 1.4 }
      spawn: { shape: box, half_extent: { x: 0.3, y: 0.3, z: 0.3 } }
      velocity_min: { x: -0.2, y: -0.2, z: -0.2 }
      velocity_max: { x: 0.2, y: 0.2, z: 0.2 }
      acceleration: { z: 0.1 }
      rotation_degrees: { min: 0, max: 360 }
      rotation_speed_degrees: { min: -90, max: 90 }
      sprite:
        frames: [brackeys-flame-01-a]
        playback: cycle
        facing: camera-facing
        blend: additive
      size_over_life:
        - { age: 0, value: 0.005 }
        - { age: 0.0756302, value: 0.25 }
        - { age: 0.403361, value: 0.25 }
        - { age: 1, value: 0.179775 }
      color_over_life:
        - { age: 0, rgba: [1, 0.608967, 0.244135, 0] }
        - { age: 0.0798319, rgba: [1, 0.608967, 0.244135, 0.18] }
        - { age: 0.42, rgba: [0.72, 0.15, 0.015, 0.075] }
