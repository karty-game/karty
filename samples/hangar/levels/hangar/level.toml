name = "acid-boundary"
source = "recess.png"
profile = "environment"

[[textures]]
name = "piston"
source = "piston.png"
profile = "environment"

# Neutral secondary modulation; maps are unused in this role.
[[textures]]
name = "wall-weathering"
source = "wall-weathering.png"
profile = "environment"

# Fixed wall decal; alpha coverage supplies the irregular eroded outline.
[[textures]]
name = "rust-drips"
source = "rust-drips.png"
profile = "environment"

[[textures]]
name = "barrel-coals"
source = "barrel-coals.png"
profile = "environment"

[textures.material_strengths]
normal = 0
height = 0
ao = 0
rim = 0

# Link the warm live lamp to a real solid top surface, separate from particles.
[textures.emission]
intensity = 0.60
lights = ["barrel-fire-light"]

[textures.emission.pulse]
depth = 0.28
period_seconds = 0.85

[lightmap]
enabled = true
density = 4
page_size = 1024
padding = 4
max_pages = 1
max_texels = 1048576
shadow_size = 256
offline = true
bake_samples = 32
bake_bounces = 2
bake_denoise = "medium"

