name = "arrival-sign"
source = "arrival-sign.png"
profile = "interface"
max_sprite_texels_per_unit = 0 # Keep authored lettering readable.

[[textures]]
name = "reactor-sign"
source = "reactor-sign.png"
profile = "interface"
max_sprite_texels_per_unit = 0

[[textures]]
name = "exit-sign"
source = "exit-sign.png"
profile = "interface"
max_sprite_texels_per_unit = 0

