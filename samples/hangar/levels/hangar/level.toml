# Hangar materials and baked lighting.
[level]
name = "levels.hangar"
kind = "world"

[world]
source = "world.yaml"
# Use the standard sprite density cap, retaining more fan and decal detail.
max_sprite_texels_per_unit = 128

[[textures]]
name = "olive"
source = "olive.png"
profile = "environment"

[textures.materialize]
preset = "metal"

[textures.material_strengths]
normal = 0.80
height = 0.10
ao = 0.80
rim = 0.1

[[textures]]
name = "ribbed"
source = "ribbed.png"
profile = "environment"

[textures.materialize]
preset = "metal"

[textures.material_strengths]
