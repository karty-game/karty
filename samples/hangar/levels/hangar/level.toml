[lightmap]
enabled = true
density = 5
page_size = 1024
padding = 4
max_pages = 1
max_texels = 1048576
shadow_size = 256
lights = [
  "arrival-key",
  "reactor-overhead",
  "control-fill",
  "zig-key",
  "zig-far",
  "extraction-key",
  "loading-key",
  "window-key",
]
offline = true
bake_samples = 32
bake_bounces = 2
bake_denoise = "medium"
