height = 0.00
ao = 0.00
rim = 0.1

[[textures]]
name = "reactor-lamp"
source = "lamp.png"
profile = "environment"

[textures.material_strengths]
normal = 0.0
height = 0.0
ao = 0.0
rim = 0.1

[textures.emission]
intensity = 0.65
lights = ["core-west", "core-east", "core-front"]

[textures.emission.pulse]
depth = 0.8
