animations:
  version: 1
  presets:
    - {
        name: terminal-glitch,
        kind: flipbook,
        frames: [screen, screen-glitch-1, screen-glitch-2, screen-glitch-3],
        fps: 30,
        interval_seconds: 3,
      }
    - {
        name: acid-ripple,
        kind: liquid,
        amplitude: 0.065,
        frequency: 1.2,
        speed: 0.6,
        surface_amplitude: 0.045,
        opacity: 0.70,
        pixel_size: 0,
      }
    - { name: ventilation-fan, kind: spin, axis: { y: 1 }, speed: 2.5 }
    # Start extended; retract into the floor body with the rod always embedded.
    - { name: service-piston, kind: oscillate, offset: { z: -0.25 }, period_seconds: 1.8 }
    - { name: hidden-liquid-boundary, kind: liquid, frequency: 1, opacity: 0 }
    # BEGIN PARTICLE LAB EFFECTS: animations
    # END PARTICLE LAB EFFECTS: animations
  materials:
    - { material: screen, preset: terminal-glitch }
    - { material: toxic, preset: acid-ripple }
    - { material: acid-boundary, preset: hidden-liquid-boundary }
uv: { mode: triplanar, anchor: world, scale: { x: 2, y: 2 } }
rooms:
  - id: arrival
    floor: { c: 0.00 }
    ceiling: { c: 4.80 }
    floor_material: floor
    ceiling_material: ceiling
    ceiling_uv: { mode: planar, anchor: world, scale: { x: 3, y: 3 } }
    wall_uv: { mode: planar, anchor: world, scale: { x: 3, y: 4 } }
    wall_secondary:
