# Original Hangar environment.
# All connected wall spans are open; door mechanisms are deferred.
version: 10
particles:
  version: 1
  presets:
    - name: acid-sparkle
      capacity: 48
      emission: { rate: 12, duration_seconds: 3 }
      lifetime_seconds: { min: 0.9, max: 1.6 }
      spawn: { shape: box, half_extent: { x: 0.9, y: 0.12, z: 0.01 } }
      velocity_min: { x: -0.045, y: -0.045, z: 0.28 }
      velocity_max: { x: 0.045, y: 0.045, z: 0.55 }
      acceleration: { z: 0.08 }
      drag: 0.12
      sprite: { frames: [acid-sparkle], playback: cycle, facing: camera-facing, blend: additive }
      rotation_degrees: { min: -45, max: 45 }
      rotation_speed_degrees: { min: -50, max: 50 }
      size_over_life:
        - { age: 0, value: 0.11 }
        - { age: 0.15, value: 0.14 }
        - { age: 1, value: 0.025 }
      color_over_life:
        - { age: 0, rgba: [0.24, 0.95, 0.32, 0] }
        - { age: 0.12, rgba: [0.24, 0.95, 0.32, 0.9] }
        - { age: 1, rgba: [0.06, 0.40, 0.14, 0] }
    - name: barrel-fire
      capacity: 64
      emission: { rate: 24, duration_seconds: 2 }
      lifetime_seconds: { min: 0.40, max: 0.65 }
      spawn: { shape: box, half_extent: { x: 0.15, y: 0.15, z: 0.01 } }
      velocity_min: { x: -0.04, y: -0.04, z: 0.70 }
      velocity_max: { x: 0.04, y: 0.04, z: 1.30 }
      acceleration: { z: 0.35 }
      drag: 0.6
      sprite:
        frames: [barrel-flame-1, barrel-flame-2, barrel-flame-3]
        fps: 12
        playback: cycle
        facing: upright
        blend: additive
      rotation_degrees: { min: -12, max: 12 }
      rotation_speed_degrees: { min: -12, max: 12 }
      size_over_life:
        - { age: 0, value: 0.52 }
        - { age: 0.25, value: 0.48 }
        - { age: 1, value: 0.23 }
      color_over_life:
        - { age: 0, rgba: [1, 0.80, 0.27, 0] }
        - { age: 0.12, rgba: [1, 0.62, 0.12, 0.85] }
        - { age: 0.6, rgba: [1, 0.24, 0.035, 0.5] }
        - { age: 1, rgba: [0.65, 0.06, 0.005, 0] }
    - name: barrel-embers
      capacity: 32
      emission:
        rate: 8
        duration_seconds: 2
        bursts: [{ at_seconds: 0.35, count: 6 }]
      lifetime_seconds: { min: 0.45, max: 0.75 }
      spawn: { shape: box, half_extent: { x: 0.13, y: 0.13, z: 0.02 } }
      velocity_min: { x: -0.18, y: -0.18, z: 0.70 }
      velocity_max: { x: 0.18, y: 0.18, z: 1.35 }
      acceleration: { z: -0.30 }
      drag: 0.12
      sprite: { frames: [barrel-ember], playback: cycle, facing: camera-facing, blend: additive }
      size_over_life:
        - { age: 0, value: 0.045 }
        - { age: 1, value: 0.012 }
      color_over_life:
        - { age: 0, rgba: [1, 0.78, 0.22, 0.9] }
        - { age: 1, rgba: [0.85, 0.12, 0.015, 0] }
  emitters:
    # Surface Z=-1.10; spawn just above its wave crests. Each motion envelope
    # stays inside its basin sector, clear of the elevated zigzag walkway.
    - {
        id: acid-south-sparkles-0,
        preset: acid-sparkle,
        position: { x: 25, y: 17, z: -0.93 },
        seed: 101,
        playback: { mode: cycle, period_seconds: 3 },
      }
    - {
        id: acid-south-sparkles-1,
        preset: acid-sparkle,
        position: { x: 29, y: 16.7, z: -0.93 },
        seed: 107,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.25 },
      }
    - {
        id: acid-south-sparkles-2,
        preset: acid-sparkle,
        position: { x: 34.94, y: 16.5, z: -0.93 },
        seed: 113,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.5 },
      }
    - {
        id: acid-south-sparkles-3,
        preset: acid-sparkle,
        position: { x: 37, y: 19, z: -0.93 },
        seed: 127,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.75 },
      }
    - {
        id: acid-entry-sparkles-0,
        preset: acid-sparkle,
        position: { x: 32.5, y: 22, z: -0.93 },
        seed: 131,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.4 },
      }
    - {
        id: acid-entry-sparkles-1,
        preset: acid-sparkle,
        position: { x: 37.2, y: 22, z: -0.93 },
        seed: 137,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.9 },
      }
    - {
        id: acid-west-sparkles-0,
        preset: acid-sparkle,
        position: { x: 26.2, y: 26.7, z: -0.93 },
        seed: 139,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.6 },
      }
    - {
        id: acid-west-sparkles-1,
        preset: acid-sparkle,
        position: { x: 26.2, y: 29.2, z: -0.93 },
        seed: 149,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.2 },
      }
    - {
        id: acid-east-sparkles-0,
        preset: acid-sparkle,
        position: { x: 37.6, y: 26, z: -0.93 },
        seed: 151,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.8 },
      }
    - {
        id: acid-east-sparkles-1,
        preset: acid-sparkle,
        position: { x: 37.6, y: 30, z: -0.93 },
        seed: 157,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.3 },
      }
    - {
        id: acid-east-sparkles-2,
        preset: acid-sparkle,
        position: { x: 35, y: 33, z: -0.93 },
        seed: 163,
        playback: { mode: cycle, period_seconds: 3, delay_seconds: 0.7 },
      }
    # The small fire and its complete sprite envelope stay below the 2.60 m
    # alcove ceiling. The barrel is away from the arrival-to-reactor route.
    - {
        id: inspection-barrel-fire,
        preset: barrel-fire,
        position: { x: 14.8, y: -1.55, z: 1.08 },
        seed: 181,
        playback: { mode: cycle, period_seconds: 2 },
      }
    - {
        id: inspection-barrel-embers,
        preset: barrel-embers,
        position: { x: 14.8, y: -1.55, z: 1.12 },
        seed: 191,
        playback: { mode: cycle, period_seconds: 2 },
      }
animations:
  version: 1
  presets:
    - {
        name: terminal-glitch,
        kind: flipbook,
        frames: [screen, screen-glitch-1, screen-glitch-2, screen-glitch-3],
        fps: 30,
        interval_seconds: 3,
      }
    - {
        name: acid-ripple,
        kind: liquid,
        amplitude: 0.065,
        frequency: 1.2,
        speed: 0.6,
        surface_amplitude: 0.045,
        opacity: 0.70,
        pixel_size: 0,
      }
    - { name: ventilation-fan, kind: spin, axis: { y: 1 }, speed: 2.5 }
    # Start extended; retract into the floor body with the rod always embedded.
    - { name: service-piston, kind: oscillate, offset: { z: -0.25 }, period_seconds: 1.8 }
    - { name: hidden-liquid-boundary, kind: liquid, frequency: 1, opacity: 0 }
  materials:
    - { material: screen, preset: terminal-glitch }
    - { material: toxic, preset: acid-ripple }
    - { material: acid-boundary, preset: hidden-liquid-boundary }
uv: { mode: triplanar, anchor: world, scale: { x: 2, y: 2 } }
