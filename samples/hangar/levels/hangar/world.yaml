# Original Hangar environment.
# All connected wall spans are open; door mechanisms are deferred.
version: 17
fluids:
  version: 1
  items:
    - id: acid
      solids:
        [
          acid-south-west,
          acid-south-east,
          acid-west-0-entry,
          acid-west-0-bend,
          acid-west-1,
          acid-east-entry,
          acid-east-0,
          acid-east-1,
          acid-east-2,
        ]
      density: 25
      linear_drag: 3
      angular_drag: 2
      foam_width: 0.22
      foam_strength: 0.7
      foam_color: { x: 0.74, y: 0.88, z: 0.30 }
      fog_density: 0.45
      fog_color: { x: 0.075, y: 0.16, z: 0.025 }
      distortion: 0.006
