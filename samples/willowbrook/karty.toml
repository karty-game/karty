[project]
name = "willowbrook"
compiler = "tinygo"

[project.resolution]
width = 1280
height = 720

[sdk]
version = "0.0.14"

[packages.tiled]
folder = "../../packages/tiled"

[packages.controllers]
folder = "../../packages/controllers"

[[build.processors]]
use = "tiled.compile"
inputs = [
  "internal/village/village.tmj",
  "internal/village/village.tsj",
  "internal/village/tiled-build.json",
  "levels/village/dual-*.png",
]
