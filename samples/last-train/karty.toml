[project]
name = "Last Train"
storage_id = "com.karty.samples.last-train"
compiler = "tinygo"

[project.resolution]
width = 1280
height = 720

[sdk]
version = "0.0.19"

[[build.processors]]
use = "dialogue.compile"
inputs = ["dialogue/*.yarn"]

[[assets.font]]
role = "body"
source = "assets/fonts/DejaVuSans.ttf"

[[assets.font]]
role = "mono"
source = "assets/fonts/LiberationSerif-Italic.ttf"

[[assets.font]]
role = "display"
source = "assets/fonts/DejaVuSerif-Bold.ttf"

[[assets.music]]
name = "last-carriage"
source = "assets/audio/last-carriage.wav"

[[assets.environment]]
name = "night-train"
source = "assets/audio/night-train.wav"

[[assets.sound]]
name = "ticket-punch"
source = "assets/audio/ticket-punch.wav"

[[assets.sound]]
name = "station-whistle"
source = "assets/audio/station-whistle.wav"

[packages.dialogue]
archive = "https://github.com/karty-game/karty-packages/releases/download/dialogue-v0.0.1/dialogue-0.0.1.kpkg"
sha256 = "100498ee22c69c7533d48d901d5411cbd1c3a5dd28da30f6a45d551033ef8753"

[packages.savegame]
archive = "https://github.com/karty-game/karty-packages/releases/download/savegame-v0.0.1/savegame-0.0.1.kpkg"
sha256 = "b056ff8b970ba9eb993a29b33e14f29c9c5a733415b92f23c5da340609265616"
