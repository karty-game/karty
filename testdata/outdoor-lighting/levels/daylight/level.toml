[level]
name = "levels.daylight"
kind = "world"

[world]
source = "world.yaml"

[lightmap]
enabled = true
offline = true
density = 16
page_size = 1024
padding = 2
bake_samples = 32
bake_bounces = 3
bake_denoise = "medium"

[lightmap.environment]
times = [0, 9, 12, 17]
default_time = 12
weather_variants = false

[chunks]
enabled = true

[[textures]]
name = "stone"
source = "stone.png"
profile = "environment"

[textures.materialize]
preset = "stone"
metallic_scale = 0

