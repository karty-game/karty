name: Material tools (build artifacts only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Resolve and preserve one Materialize lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact Rust pin
        id: pins
        run: python -c 'import json,os; p=json.load(open("scripts/material-tools/sources.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("rust="+p["rust"]+"\n")'
      - name: Install pinned Rust
        run: rustup toolchain install '${{ steps.pins.outputs.rust }}' --profile minimal
      - name: Resolve once (upstream has no Cargo.lock)
        run: python scripts/material-tools/build.py prepare-lock --output dist/material-tools/shared-lock
      - name: Preserve lock for replay and all matrix jobs
        uses: actions/upload-artifact@v4
        with:
          name: material-tools-lock
          path: dist/material-tools/shared-lock/
          if-no-files-found: error
          retention-days: 90

  build:
    needs: lock
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-14
          - target: windows-amd64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact Rust pin
        id: pins
        run: python -c 'import json,os; p=json.load(open("scripts/material-tools/sources.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("rust="+p["rust"]+"\n")'
      - name: Install pinned Rust
        run: rustup toolchain install '${{ steps.pins.outputs.rust }}' --profile minimal
      - name: Set up MSVC x64 environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - uses: actions/download-artifact@v4
        with:
          name: material-tools-lock
          path: dist/material-tools/shared-lock
      - name: Scaffolding unit tests
        run: python -B -m unittest discover -s scripts/material-tools -p 'test_*.py' -v
      - name: Build, smoke and bundle (Cargo --locked)
        run: python scripts/material-tools/build.py build --target '${{ matrix.target }}' --lock-dir dist/material-tools/shared-lock
      - name: Preserve binaries, notices, source identity and SHA256 metadata
        uses: actions/upload-artifact@v4
        with:
          name: material-tools-${{ matrix.target }}
          path: dist/material-tools/artifacts/*
          if-no-files-found: error
          retention-days: 90