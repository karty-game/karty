name: Windows ARM64 package validation
on:
  workflow_call:
    inputs:
      source-run-id:
        description: Workflow run containing the windows-arm64-game artifact
        type: string
        required: true
      source-ref:
        description: Validated source commit for reusable release checks
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Existing workflow run containing the windows-arm64-game artifact
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    name: Windows ARM64 package validation
    runs-on: windows-11-arm
    timeout-minutes: 10
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64-game
          path: game
          run-id: ${{ inputs.source-run-id }}
          github-token: ${{ github.token }}
      - name: Validate native ARM64 host and valid, invalid and missing cartridges
        working-directory: game
        shell: pwsh
        run: |
          . ../.github/scripts/windows-arm64-game.ps1
          Test-KartyWindowsPackage
      - name: Record Windows validation scope
        if: success()
        shell: pwsh
        run: |
          'Windows ARM64: native executable, packaged cartridge acceptance, invalid/missing cartridge rejection. Graphics are not qualified by this package-validation job.' >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve Windows ARM64 diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-startup-diagnostics
          path: game/host.*.log
          if-no-files-found: ignore
          retention-days: 7
