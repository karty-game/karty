name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOWORK: "off"
jobs:
  windows-process-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      GOCACHE: ${{ github.workspace }}/tmp/ci/go-build
      GOMODCACHE: ${{ github.workspace }}/tmp/ci/go-mod
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Restore Go modules and compiler output
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-cli-process-${{ hashFiles('mise.toml', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cli-process-${{ hashFiles('mise.toml', 'go.sum') }}-
      - run: mise run test-process-lifecycle
      - run: mise run test-platform-setup
      - name: Save completed compiler and lint cache work
        if: ${{ !cancelled() && steps.go-cache.outputs.cache-primary-key != '' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/tmp/ci/go-build
      GOMODCACHE: ${{ github.workspace }}/tmp/ci/go-mod
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/tmp/ci/lint
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Restore Go modules, compiler output and lint facts
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
            ${{ env.GOLANGCI_LINT_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-cli-test-${{ hashFiles('mise.toml', 'go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cli-test-${{ hashFiles('mise.toml', 'go.sum', '.golangci.yml') }}-
      - run: mise run check-fmt
      - run: mise run test
      - run: mise run lint
      - run: mise run build
      - name: Save completed compiler and lint cache work
        if: ${{ !cancelled() && steps.go-cache.outputs.cache-primary-key != '' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
            ${{ env.GOLANGCI_LINT_CACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  web-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOCACHE: ${{ github.workspace }}/tmp/ci/go-build
      GOMODCACHE: ${{ github.workspace }}/tmp/ci/go-mod
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Restore Go modules and compiler output
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-cli-web-delivery-${{ hashFiles('mise.toml', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cli-web-delivery-${{ hashFiles('mise.toml', 'go.sum') }}-
      - name: Install pinned browser tooling
        run: mise exec -- npm ci --ignore-scripts
      - name: Install Chromium and browser system dependencies
        run: mise exec -- npx playwright install --with-deps chromium --only-shell
      - name: Verify web release delivery in Chromium
        run: mise run check-web-delivery
      - name: Upload browser delivery report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-delivery-results
          path: dist/validation/web-delivery/results.json
          if-no-files-found: ignore
      - name: Save completed compiler and lint cache work
        if: ${{ !cancelled() && steps.go-cache.outputs.cache-primary-key != '' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  materialize-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOCACHE: ${{ github.workspace }}/tmp/ci/go-build
      GOMODCACHE: ${{ github.workspace }}/tmp/ci/go-mod
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Restore Go modules and compiler output
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-cli-materialize-${{ hashFiles('mise.toml', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cli-materialize-${{ hashFiles('mise.toml', 'go.sum') }}-
      - name: Install headless software graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri
      - name: Generate atlas maps and verify paired QOI cache
        run: mise run check-materialize-software
      - name: Save completed compiler and lint cache work
        if: ${{ !cancelled() && steps.go-cache.outputs.cache-primary-key != '' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
