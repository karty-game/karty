name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: mise run test
      - run: mise run lint
      - run: mise run build
