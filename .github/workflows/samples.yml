name: Build samples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: samples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - run: mise run build-samples
      - uses: actions/upload-artifact@v7
        with:
          name: sample-site
          path: dist/samples-site
          if-no-files-found: error
          retention-days: 7
      - name: Preview location
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          base="${PAGES_BASE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}"
          destination=main
          if [ -n "$PR_NUMBER" ]; then destination="pr/$PR_NUMBER"; fi
          printf '[Sample preview](%s/%s/) — available after **Publish samples** succeeds.\n' "${base%/}" "$destination" >> "$GITHUB_STEP_SUMMARY"
