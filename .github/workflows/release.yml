name: Release CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KARTY_TEST_SDK: "0.0.1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run test
      - run: mise run lint
      - run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dev xorg-dev xvfb
      - run: mise run build
      - name: Install the pinned public SDK
        run: ./dist/karty sdk install "$KARTY_TEST_SDK"
      - run: mise run install-browser
      - name: Validate the customer workflow against published hosts
        run: mise run check-integration
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
