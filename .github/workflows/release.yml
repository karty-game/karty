name: Release CLI
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  GOWORK: "off"
jobs:
  validate-windows-process-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run test-process-lifecycle
      - run: mise run test-platform-setup
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      GOWORK: "off"
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run check-fmt
      - run: mise run test
      - run: mise run lint
      - run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dev xorg-dev xvfb
      - run: mise run build
      - name: Install the pinned public SDK
        run: ./dist/karty sdk install "$(./dist/karty sdk current)"
      - run: mise run install-browser
      - name: Check new-project native and web builds against published hosts
        run: mise run smoke
      - name: Check staged JavaScript and both guest compilers
        run: mise run check-web
      - name: Execute the public host and guest in Chromium
        run: mise run check-browser
      - name: Check the UI template in native WASM and Chromium
        run: mise run check-ui
      - name: Check Hangar guest allocations
        run: mise run check-hangar-fps-allocations
      - name: Check runtime guest allocations
        run: mise run check-guest-allocations
      - name: Check development watcher and publication
        run: mise run check-dev
      - name: Preserve failed UI browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-ui-diagnostics-${{ runner.arch }}
          path: dist/validation/ui-browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package Windows ARM64 game on Linux
        if: matrix.runner == 'ubuntu-24.04'
        working-directory: samples/ui-demo
        run: ../../dist/karty build --target native --platform windows-arm64
      - uses: actions/upload-artifact@v7
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: windows-arm64-game
          path: samples/ui-demo/dist/native/windows-arm64/
          if-no-files-found: error
  validate-windows-arm64:
    needs: validate
    runs-on: windows-11-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64-game
          path: game
      - name: Validate packaged cartridge without developer tools
        working-directory: game
        shell: pwsh
        run: |
          ./karty-host.exe --check --cartridge game.kart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned ARM64 software OpenGL
        working-directory: game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-llvmpipe-arm64-26.2.5.7z'
          $url = 'https://github.com/mmozeiko/build-mesa/releases/download/26.2.5/mesa-llvmpipe-arm64-26.2.5.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = 'e7df75398d50e07a68bbffa5cff2ece4c85e5f8ef8bda497f560dd04fe60cbbd'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'ARM64 Mesa archive checksum mismatch'
          }
          $driverDirectory = Join-Path $PWD 'karty-host.exe.local'
          New-Item -ItemType Directory -Path $driverDirectory | Out-Null
          & 7z x $archive "-o$driverDirectory" opengl32.dll -y
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract ARM64 Mesa OpenGL' }
          if (-not (Test-Path -LiteralPath (Join-Path $driverDirectory 'opengl32.dll'))) {
            throw 'ARM64 Mesa archive is missing opengl32.dll'
          }
          # DotLocal redirection applies even to the host's System32 DLL loads.
          # This private CI driver is not added to the packaged game artifact.
          Get-FileHash -LiteralPath (Join-Path $driverDirectory 'opengl32.dll') -Algorithm SHA256
      - name: Native game startup smoke with software OpenGL
        working-directory: game
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $game = Start-Process -FilePath ./karty-host.exe -ArgumentList '--cartridge', 'game.kart' -PassThru -RedirectStandardOutput host.stdout.log -RedirectStandardError host.stderr.log
          try {
            Start-Sleep -Seconds 8
            if ($game.HasExited) {
              Get-Content host.stdout.log, host.stderr.log
              throw "Windows ARM64 game exited during startup (code $($game.ExitCode))"
            }
            $expectedDriver = (Resolve-Path './karty-host.exe.local/opengl32.dll').Path
            $loadedDrivers = @((Get-Process -Id $game.Id).Modules | Where-Object ModuleName -eq 'opengl32.dll')
            $loadedDrivers | Format-Table ModuleName, FileName
            if (-not ($loadedDrivers | Where-Object FileName -eq $expectedDriver)) {
              throw 'Windows ARM64 smoke did not load the pinned software OpenGL driver'
            }
          } finally {
            if (-not $game.HasExited) { Stop-Process -Id $game.Id -Force }
          }
      - name: Preserve Windows ARM64 startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-startup-diagnostics
          path: game/host.*.log
          if-no-files-found: ignore
          retention-days: 7
  release:
    needs: [validate, validate-windows-arm64, validate-windows-process-lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
