name: Release CLI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing immutable CLI tag to validate or publish
        type: string
        required: true
      publish:
        description: Publish after validation (false runs validation only)
        type: boolean
        default: false
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Check immutable tag resolution
        run: node --test .github/scripts/resolve-release-tag.test.mjs
      - name: Resolve exact release commit
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: bash .github/scripts/resolve-release-tag.sh
  validate-windows-process-lifecycle:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: jdx/mise-action@v4
      - run: mise run test-process-lifecycle
      - run: mise run test-platform-setup
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      GOWORK: "off"
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run check-fmt
      - run: mise run test
      - run: mise run lint
      - run: sudo apt-get update && sudo apt-get install --yes libgl1-mesa-dev xorg-dev xvfb
      - run: mise run build
      - name: Install the pinned public SDK
        run: ./dist/karty sdk install "$(./dist/karty sdk current)"
      - name: Check current sample SDK pins
        run: mise run check-release
      - name: Check new-project native and web builds against published hosts
        run: mise run smoke
      - name: Check Hangar guest allocations
        run: mise run check-hangar-fps-allocations
      - name: Check runtime guest allocations
        run: mise run check-guest-allocations
      - name: Check development watcher and publication
        run: mise run check-dev
      - name: Package Windows ARM64 game on Linux
        if: matrix.runner == 'ubuntu-24.04'
        working-directory: samples/ui-demo
        run: ../../dist/karty build --target native --platform windows-arm64
      - uses: actions/upload-artifact@v7
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: windows-arm64-game
          path: samples/ui-demo/dist/native/windows-arm64/
          if-no-files-found: error
  validate-windows-arm64:
    needs: [prepare, validate]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows-arm64-smoke.yml
    with:
      source-run-id: ${{ github.run_id }}
      source-ref: ${{ needs.prepare.outputs.commit }}
  release:
    needs: [prepare, validate, validate-windows-arm64, validate-windows-process-lifecycle]
    if: github.event_name == 'push' || inputs.publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Verify release tag still identifies the validated commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VALIDATED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          current=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          test "$current" = "$VALIDATED_COMMIT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
