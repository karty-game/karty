# $schema: ../../.karty/schemas/levels/hooks.schema.json
version: 6
rooms:
  - id: room
    boundary:
      - { id: south, start: { x: 0, y: 0 }, end: { x: 4, y: 0 }, material: surface }
      - { id: east, start: { x: 4, y: 0 }, end: { x: 4, y: 4 }, material: surface }
      - { id: north, start: { x: 4, y: 4 }, end: { x: 0, y: 4 }, material: surface }
      - { id: west, start: { x: 0, y: 4 }, end: { x: 0, y: 0 }, material: surface }
    floor: { a: 0, b: 0, c: 0 }
    ceiling: { a: 0, b: 0, c: 4 }
    floor_material: surface
    ceiling_material: surface
    contents:
      - { id: marker, kind: actor, position: { x: 2, y: 2, z: 1 }, actor: { tags: [fixture] } }
