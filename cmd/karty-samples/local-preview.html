<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Preview.Title}} · Karty samples</title>
    <style>
      {{siteCSS}}
    </style>
  </head>
  <body class="samples-page">
    <main class="gallery-main">
      <a class="text-link" href="../">Back to samples</a>
      <h1>{{.Preview.Title}}</h1>
      <p>{{.Preview.Description}}</p>
      <img src="preview.jpg" width="960" height="540" alt="{{.Preview.Alt}}" style="max-width:100%;height:auto" />
      <h2>Build locally to play</h2>
      <p>
        This sample uses candidate SDK 0.0.12. Follow its setup instructions, build the web target, then run
        <code>mise run docs</code> again from the CLI repository root.
      </p>
      <p><a class="text-link" href="{{.SourceURL}}">Source and setup instructions</a></p>
    </main>
  </body>
</html>
