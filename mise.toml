[tools]
hk = "2.8.0"
taplo = "0.10.0"
uv = "0.13.5"
yamllint = { version = "1.38.0", uvx = true }
prettier = "3.9.10"
golangci-lint = "2.15.0"
goreleaser = "2.18.3"
go = "1.27.3"
node = "26.12.1"

# Required by the public SDK offline baker on Go 1.27.
[env]
GOEXPERIMENT = "simd"

[hooks]
postinstall = "hk install --mise"

[shell_alias]
karty = "{{config_root}}/dist/karty"
fmt = "mise run fmt"
lint = "mise run lint"
test = "mise run test"

# Keep everyday commands here; focused tasks live under tasks/.
[task_config]
includes = ["tasks/*.toml", "tasks/samples/*.toml"]

[tasks.test]
depends = ["generate-hangar-ceiling-lights"]
run = [
  "go run ./cmd/karty-release --check",
  "go run ./cmd/karty-test-sdk",
  "go run ./cmd/karty-test-packages",
  "bash scripts/test.sh",
]

[tasks.test-unit]
description = "Run unit tests without the published SDK download check"
depends = ["generate-hangar-ceiling-lights"]
run = ["go run ./cmd/karty-test-packages", "bash scripts/test.sh"]

[tasks.prepare-test-packages]
description = "Prepare checksum-pinned published packages before timed consumer tests"
run = "go run ./cmd/karty-test-packages"

[tasks.build]
run = "go build -o dist/karty ./cmd/karty"

[tasks.check]
run = ["mise run check-fmt", "mise run lint", "mise run test", "mise run build"]

[tasks.fmt]
run = "hk fix --all --profile format"

[tasks.check-fmt]
run = "hk check --all --profile format"

[tasks.install-browser]
run = ["npm ci --ignore-scripts", "npx playwright install chromium --only-shell"]

[tasks.lint]
run = "hk check --all"

[tasks.lint-go]
description = "Lint CLI and website Go packages, excluding ignored build output"
run = "golangci-lint run ./cmd/... ./internal/... ./skills/... ./website/..."

[tasks.install-hooks]
description = "Install repository hk hooks with the pinned mise environment"
run = "hk install --mise"
