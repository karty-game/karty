<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 550" role="img" aria-labelledby="title description">
  <title id="title">Client, host and level</title>
  <desc id="description">The client sends commands to the host. The host returns input and events to the client, and loads content from levels. Level-owned resources are released with their mounted level.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#a9d6c3" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="440" height="550" rx="16" fill="#111f26"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="20" y="28" width="400" height="112" rx="12" fill="#17342f" stroke="#51816c"/>
    <text x="220" y="60" fill="#d9f0dc" font-size="22" font-weight="600">Client</text>
    <text x="220" y="89" fill="#c3d1cc" font-size="16">Your Go game code</text>
    <text x="220" y="115" fill="#c3d1cc" font-size="15">Rules · progression · menus</text>
    <path d="M140 151V228" fill="none" stroke="#a9d6c3" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="140" y="191" dx="-17" text-anchor="end" fill="#d9f0dc" font-size="15">Commands</text>
    <path d="M290 228V151" fill="none" stroke="#a9d6c3" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="290" y="181" dx="17" text-anchor="start" fill="#d9f0dc" font-size="15">Input</text>
    <text x="290" y="204" dx="17" text-anchor="start" fill="#d9f0dc" font-size="15">and events</text>
    <rect x="20" y="240" width="400" height="112" rx="12" fill="#20303b" stroke="#647c8b"/>
    <text x="220" y="272" fill="#edf1e9" font-size="22" font-weight="600">Host</text>
    <text x="220" y="301" fill="#c3d1cc" font-size="16">Runs the cartridge</text>
    <text x="220" y="327" fill="#c3d1cc" font-size="15">Input · physics · graphics · UI · audio</text>
    <path d="M220 420V365" fill="none" stroke="#a9d6c3" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="240" y="398" text-anchor="start" fill="#d9f0dc" font-size="15">Loads level content</text>
    <rect x="20" y="432" width="400" height="90" rx="12" fill="#342d25" stroke="#998063"/>
    <text x="220" y="466" fill="#f1dfbe" font-size="22" font-weight="600">Level</text>
    <text x="220" y="496" fill="#d6cbbc" font-size="16">Compiled world · textures · content</text>
  </g>
</svg>
