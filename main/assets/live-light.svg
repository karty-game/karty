<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-labelledby="title desc">
  <title id="title">A moving lamp stays live</title>
  <desc id="desc">The orange lamp moves above a floor. Its light patch follows it. Fixed room lamps can be baked.</desc>
  <style>
    .lamp { animation: travel 4s ease-in-out infinite alternate; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(230px); } }
    @media (prefers-reduced-motion: reduce) { .lamp { animation: none; } }
    text { font: 24px system-ui, sans-serif; fill: #243331; }
  </style>
  <rect width="640" height="190" rx="12" fill="#f1f1e9"/>
  <path d="M40 142H600" stroke="#52625b" stroke-width="3"/>
  <path d="M160 54H410" stroke="#52625b" stroke-dasharray="5 7"/>
  <g class="lamp">
    <ellipse cx="160" cy="140" rx="78" ry="10" fill="#de7c33" opacity=".32"/>
    <path d="M150 67L102 139H218L170 67Z" fill="#de7c33" opacity=".13"/>
    <circle cx="160" cy="54" r="13" fill="#de7c33" stroke="#9d3d19" stroke-width="2"/>
  </g>
  <text x="40" y="30">Moving lamp</text>
  <text x="40" y="174">Keep changing lights live. Bake steady lights.</text>
</svg>
