<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="title description">
  <title id="title">2D canvas and 3D world coordinates</title>
  <desc id="description">On the 2D canvas, X points right and Y points down from the upper-left corner. In the 3D world, X and Y describe the floor plan and Z points up. The lower drawing is a schematic view of the axes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#6ee7cc" stroke-width="1.5"/></marker>
  </defs>
  <rect width="440" height="400" rx="16" fill="#111d26"/>
  <g font-family="system-ui,sans-serif" fill="#edf4f5" font-size="16">
    <text x="24" y="32" font-size="20" font-weight="600">2D canvas</text>
    <rect x="40" y="54" width="350" height="115" rx="8" fill="#172630" stroke="#283d48"/>
    <path d="M70 78H300M70 78V143" stroke="#6ee7cc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="77" y="101">(0, 0)</text><text x="310" y="84">+X</text><text x="83" y="149">+Y</text>
    <text x="24" y="210" font-size="20" font-weight="600">3D world</text>
    <path d="M220 312L350 350M220 312L90 350M220 312V239" stroke="#6ee7cc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="358" y="359">+X</text><text x="55" y="359">+Y</text><text x="230" y="249">+Z up</text>
    <text x="220" y="384" text-anchor="middle" fill="#93a8b2">X/Y form the floor plan; Z is height.</text>
  </g>
</svg>
