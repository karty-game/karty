version: "2"

# Inspired by Golden config for golangci-lint gist
# ref: https://gist.github.com/maratori/47a4d00457a92aa426dbd48a18776322

run:
  timeout: 2m

issues:
  # Maximum count of issues with the same text.
  max-same-issues: 5

linters:
  default: all
  disable:
    - depguard # checks if package imports are in a list of acceptable packages
    - exhaustruct # checks if all structure fields are initialized
    - exhaustruct_v5
    - ireturn # accept interfaces, return concrete types
    - lll # [replaced by golines] reports long lines
    - revive # drop-in replacement of golint
    - wrapcheck # checks that errors returned from external packages are wrapped
    - testpackage # makes you use a separate _test package
    - nonamedreturns # disallow named returns
    - wsl # replaced by wsl_v5
    - noinlineerr # disabled because of conflicts with other linters
    - godoclint # disabled because of conflicts with other linters
    - gomodguard # replaced by gomodguard_v2
    - gomoddirectives # local replacements are required by the multi-module workspace
    - goconst # temporary disable because of noise caused by https://github.com/jgautheron/goconst/pull/46

  settings:
    funlen:
      # Checks the number of lines in a function.
      # If lower than 0, disable the check.
      # Default: 60
      lines: 70
      # Checks the number of statements in a function.
      # If lower than 0, disable the check.
      # Default: 40
      statements: 50

    cyclop:
      # The maximal cyclomatic complexity a function can have.
      # Default: 10
      max-complexity: 20
      # The maximal average package complexity.
      # If it's higher than 0.0 (float) the check is enabled.
      # Default: 0.0
      package-average: 12.0

    errcheck:
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      # Such cases aren't reported by default.
      # Default: false
      check-type-assertions: true

    misspell:
      locale: US

    mnd:
      # List of function patterns to exclude from analysis.
      # Values always ignored: `time.Date`,
      # `strconv.FormatInt`, `strconv.FormatUint`, `strconv.FormatFloat`,
      # `strconv.ParseInt`, `strconv.ParseUint`, `strconv.ParseFloat`.
      # Default: []
      checks:
        - case
        - condition
        - operation
        - return
        - assign

  exclusions:
    warn-unused: false
    paths:
      - dispatch/internal/ui/components
      - dispatch/internal/ui/utils
    presets:
      - std-error-handling
      - common-false-positives
      - legacy

    rules:
      # Prevent overflow conversion int64 -> int
      - text: "G115"
        linters: [gosec]
      # Allow only sentinel error as global var
      - text: 'Err\S+ is a global variable'
        linters: [gochecknoglobals]
      # Avoid conflict between IDE/Tools which sometimes expect a space or not
      - text: "should be written without leading space"
        linters: [nolintlint]
      # More relax for tests
      - path: '(.+)_test\.go'
        linters:
          - cyclop
          - funlen
          - dupl
      - path: "^(cmd|internal)/"
        linters:
          - cyclop
          - funlen
          - dupl

formatters:
  exclusions:
    generated: strict
    paths:
      - "(^|/)dist(/|$)"
      - '(^|/)\.(karty|codex|agents)(/|$)'
  enable:
    - gci # checks if code and import statements are formatted, with additional rules
    - gofmt # checks if the code is formatted according to 'gofmt' command
    - golines # checks if code is formatted, and fixes long lines

  settings:
    golines:
      max-len: 140

output:
  path-mode: "abs"
