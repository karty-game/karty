format_version = 1
name = "dialogue"
version = "0.1.0"
sdk = "0.0.17"

[[processors]]
name = "compile"
command = ["go", "run", "-buildvcs=false", "./cmd/yarn-processor"]

[ui]
layouts = ["ui/layouts/novel-frame.kui"]

[[ui.components]]
name = "dialogue"
source = "ui/novel-dialogue.kui"

[[ui.components]]
name = "history"
source = "ui/novel-history.kui"

[[ui.components]]
name = "choice"
source = "ui/novel-choice.kui"

[[ui.components]]
name = "history-entry"
source = "ui/novel-history-entry.kui"
